<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F6B3A">
<title>HIRZ Promo Review</title>
<link rel="icon" href="../platform-favicon-32.png">
<style>
@font-face{font-family:PS;font-weight:500;src:url(fonts/inter-latin-500-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:PS;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:PS;font-weight:800;src:url(fonts/inter-latin-800-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:PS;font-weight:500;src:url(fonts/noto-kufi-arabic-arabic-500-normal.woff2);unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:PS;font-weight:700;src:url(fonts/noto-kufi-arabic-arabic-700-normal.woff2);unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:PS;font-weight:800;src:url(fonts/noto-kufi-arabic-arabic-800-normal.woff2);unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
:root{--bg:#FBF6EC;--card:#fff;--ink:#1d2a22;--mute:#5d6b62;--line:#e6dcc8;--green:#0F6B3A;--gold:#D9A21B;--blue:#1F5FA8;--dark:#123D2A;--ok:#16803c;--no:#b42318;--acc:var(--green);--soft:#e9f4ee}
@media(prefers-color-scheme:dark){:root{--bg:#0e1612;--card:#16221b;--ink:#eaf2ec;--mute:#9db0a4;--line:#26382d;--green:#3fb374;--gold:#e8b53a;--blue:#6aa6ec;--dark:#0b2a1c;--ok:#4cc27a;--no:#ff7b6e;--soft:#16281d}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:PS,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header.hero{background:linear-gradient(135deg,#0b3d26 0%,#0F6B3A 55%,#1d8a4e 100%);color:#fff;padding:26px 0 70px;position:relative;overflow:hidden}
header.hero:after{content:"";position:absolute;inset:auto -10% -60% auto;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(217,162,27,.45),rgba(217,162,27,0) 65%)}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:64px;height:64px;border-radius:16px;background:#FBEFDF;padding:4px}
.brand b{display:block;font-size:13px;letter-spacing:.14em;color:var(--gold);font-weight:800}
.brand span{font-size:12.5px;opacity:.85}
.lg{margin-inline-start:auto;border:1.5px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;font:inherit;font-weight:700;font-size:14px;padding:7px 16px;border-radius:99px;cursor:pointer;position:relative;z-index:2}
.txt[dir=rtl]{text-align:right}.txt[dir=ltr]{text-align:left}
.hero h1{margin:18px 0 6px;font-size:clamp(24px,5vw,38px);line-height:1.3;font-weight:800;max-width:760px}
.hero p{margin:0;max-width:720px;opacity:.93;font-size:15.5px}
.steps{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1}
.steps span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:5px 12px;border-radius:99px;font-size:13px}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-top:-44px;border-radius:18px 18px 0 0}
.tabs .row{display:flex;gap:6px;overflow-x:auto;padding:10px 0 0;scrollbar-width:none}
.tabs .row::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:104px;border:0;background:transparent;color:var(--mute);font:inherit;font-weight:700;font-size:15px;padding:10px 14px 12px;border-bottom:4px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.tab i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--c)}
.tab em{font-style:normal;font-size:11.5px;background:var(--soft);color:var(--mute);border-radius:99px;padding:1px 8px}
.prog{height:5px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .3s}
.progtxt{font-size:12.5px;color:var(--mute);padding:6px 0 8px;display:flex;justify-content:space-between}
main{padding:22px 0 80px}
section.pane{display:none;--acc:var(--c)}
section.pane.on{display:block}
.lead{background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--acc);border-radius:14px;padding:14px 18px;margin:0 0 20px;color:var(--mute);font-size:15px}
.lead b{color:var(--ink)}
h2.g{display:flex;align-items:center;gap:10px;font-size:20px;margin:30px 0 12px;font-weight:800}
h2.g:before{content:"";width:8px;height:24px;border-radius:4px;background:var(--acc)}
h2.g small{font-weight:500;color:var(--mute);font-size:13px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid.t{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,border-color .2s}
.card[data-s=ok]{border-color:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 30%,transparent)}
.card[data-s=no]{border-color:var(--no);box-shadow:0 0 0 2px color-mix(in srgb,var(--no) 30%,transparent);opacity:.82}
.media{position:relative;background:#101a14;cursor:zoom-in;aspect-ratio:4/3;overflow:hidden}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.media.poster img{object-fit:contain;background:#0e1612}
.media.vid{cursor:default;aspect-ratio:auto}
.media video{width:100%;display:block;max-height:560px;background:#000}
.badge{position:absolute;top:10px;inset-inline-start:10px;background:rgba(0,0,0,.65);color:#fff;border-radius:99px;font-size:11.5px;padding:2px 10px;font-weight:700;letter-spacing:.04em}
.cap{padding:11px 14px 4px;font-size:14px;font-weight:700;line-height:1.5}
.cap small{display:block;font-weight:500;color:var(--mute);font-size:12.5px}
.txt{padding:14px 16px 4px;font-size:15.5px;line-height:1.85;white-space:pre-line}

.txt .k{display:inline-block;font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--acc);margin-bottom:4px}
.act{display:flex;gap:8px;padding:10px 12px 12px;margin-top:auto}
.btn{flex:1;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:700;font-size:14px;padding:8px 10px;border-radius:11px;cursor:pointer;min-height:40px}
.btn.ok:hover,.card[data-s=ok] .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.no:hover,.card[data-s=no] .btn.no{background:var(--no);border-color:var(--no);color:#fff}
.btn.cp{flex:0 0 auto;border-color:var(--acc);color:var(--acc)}
.slogan{padding:18px 16px 6px;text-align:center}
.slogan .e{font-size:19px;font-weight:800;direction:ltr;line-height:1.4;color:var(--acc)}
.slogan .a{font-size:17px;margin-top:6px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:16px}
.stats div{text-align:center;background:var(--soft);border-radius:12px;padding:12px 6px}
.stats b{display:block;font-size:30px;line-height:1.1;color:var(--acc);font-weight:800}
.stats span{font-size:12.5px;color:var(--mute)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.tools .btn{flex:0 0 auto;padding:7px 14px;font-size:13px}
.note{background:color-mix(in srgb,var(--gold) 16%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 55%,var(--line));border-radius:14px;padding:12px 16px;font-size:14px;margin:16px 0}
.note ul{margin:6px 0 0;padding-inline-start:20px}
/* decision */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.sum b{font-size:30px;display:block;line-height:1.1}
.sum .o b{color:var(--ok)}.sum .n b{color:var(--no)}.sum .p b{color:var(--mute)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.box h3{margin:0 0 10px;font-size:17px}
.verd{display:grid;gap:8px}
.verd label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-weight:700}
.verd input{accent-color:var(--green);width:18px;height:18px}
.verd label:has(input:checked){border-color:var(--green);background:var(--soft)}
textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;padding:10px 12px;resize:vertical}
.send{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.send .btn{background:var(--dark);color:#fff;border-color:var(--dark);padding:12px}
.send .btn.wa{background:#1fa855;border-color:#1fa855}
.send .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
pre.out{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;font:inherit;font-size:13.5px;max-height:320px;overflow:auto;margin:12px 0 0}
.lb{position:fixed;inset:0;background:rgba(5,10,7,.94);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:calc(100vh - 150px);object-fit:contain;border-radius:8px}
.lb .bar{display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.lb .bar .btn{flex:0 0 auto;min-width:96px;background:#16221b;color:#fff;border-color:#37503f}
.lb .bar .btn.ok.on{background:var(--ok);border-color:var(--ok)}.lb .bar .btn.no.on{background:var(--no);border-color:var(--no)}
.lb p{color:#dfe9e2;margin:10px 0 0;text-align:center;font-size:14px}
.toast{position:fixed;bottom:22px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:#123D2A;color:#fff;padding:10px 20px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.toast.on{opacity:1}
footer{border-top:1px solid var(--line);padding:18px 0 40px;color:var(--mute);font-size:12.5px;text-align:center}
@media(max-width:520px){.grid,.grid.t{grid-template-columns:1fr}.tab{min-width:92px;padding:10px 10px 12px;font-size:14px}.brand img{width:54px;height:54px}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="brand"><img src="../hirz-mark.png" alt="HIRZ"><div><b>HIRZ</b><span>Engineering Training &amp; Consultancy</span></div><button class="lg" id="lg"></button></div>
  <h1 data-i="h1"></h1>
  <p data-i="h2"></p>
  <div class="steps"><span data-i="st1"></span><span data-i="st2"></span><span data-i="st3"></span></div>
</div></header>
<nav class="tabs"><div class="wrap">
  <div class="row" role="tablist">
    <button class="tab" role="tab" data-t="words" style="--c:var(--green)" aria-selected="true"><i></i><span data-i="tw"></span> <em id="c-words">0</em></button>
    <button class="tab" role="tab" data-t="images" style="--c:var(--gold)" aria-selected="false"><i></i><span data-i="ti"></span> <em id="c-images">0</em></button>
    <button class="tab" role="tab" data-t="videos" style="--c:var(--blue)" aria-selected="false"><i></i><span data-i="tv"></span> <em id="c-videos">0</em></button>
    <button class="tab" role="tab" data-t="decision" style="--c:var(--dark)" aria-selected="false"><i></i><span data-i="td"></span></button>
  </div>
  <div class="progtxt"><span id="pt"></span><span id="pp">0%</span></div>
</div><div class="prog"><i id="pb"></i></div></nav>
<main class="wrap">
  <section class="pane on" id="p-words" style="--c:var(--green)"></section>
  <section class="pane" id="p-images" style="--c:var(--gold)"></section>
  <section class="pane" id="p-videos" style="--c:var(--blue)"></section>
  <section class="pane" id="p-decision" style="--c:var(--dark)"></section>
</main>
<footer><div class="wrap" data-i="ft"></div></footer>
<div class="lb" id="lb"><img id="lbi" alt=""><p id="lbc"></p>
  <div class="bar"><button class="btn" id="lbp"></button><button class="btn ok" id="lbo"></button><button class="btn no" id="lbn"></button><button class="btn" id="lbx"></button><button class="btn" id="lbf"></button></div></div>
<div class="toast" id="toast"></div>
