*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.65 PS,system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 40px}
h1{font-size:22px;margin:18px 0 4px;font-weight:800}.lead{color:var(--mute);margin:0 0 12px}
nav{position:sticky;top:0;background:var(--bg);display:flex;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);z-index:5}

nav button[aria-selected=true]{background:var(--green);color:#fff}
h2{font-size:15px;margin:22px 0 10px;color:var(--green)}h2 small{color:var(--mute);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.grid.t{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img,.card video{width:100%;display:block;background:#000;object-fit:cover;aspect-ratio:4/3;cursor:zoom-in}.card img.p{object-fit:contain;background:#fff}
.card video{cursor:auto;object-fit:contain}.card video.v{aspect-ratio:9/16;max-height:480px}.card video.h{aspect-ratio:16/9}
.cap{padding:10px 12px 4px;font-weight:700;font-size:13.5px;flex:1}.txt{padding:12px;white-space:pre-wrap;font-size:14px;flex:1}.txt b{color:var(--gold);letter-spacing:.06em;font-size:12px}
.act{display:flex;gap:8px;padding:10px 12px 12px}.btn{flex:1;text-align:center;text-decoration:none;border:1.5px solid var(--green);background:transparent;color:var(--green);font:inherit;font-weight:700;font-size:13.5px;padding:8px;border-radius:10px;cursor:pointer}
.btn.f{background:var(--green);color:#fff}.pane{display:none}.pane.on{display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}.stats div{background:var(--soft);border-radius:10px;padding:8px}.stats b{display:block;font-size:22px;color:var(--green)}.stats span{font-size:12.5px;color:var(--mute)}
